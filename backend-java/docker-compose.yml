services:
  maos-server:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Everything typed lives here. Without this, a container restart loses
      # every screen the disk tier was holding.
      - maos-workspaces:/opt/maos/workspaces
    environment:
      # Every one of these is optional; none of them has a credential in it.
      # Credentials arrive at registration and stay in the process.
      MAOS_PORT: "8080"
      MAOS_PUBLIC_ADDR: "${MAOS_PUBLIC_ADDR:-}"
      MAOS_AICOIN: "${MAOS_AICOIN:-http://host.docker.internal:8080}"
      MAOS_PROVIDER: "${MAOS_PROVIDER:-anthropic}"
      MAOS_MODEL: "${MAOS_MODEL:-}"
      MAOS_AMI: "${MAOS_AMI:-}"
      MAOS_INSTANCE_TYPE: "${MAOS_INSTANCE_TYPE:-t4g.small}"
      MAOS_S3_BUCKET: "${MAOS_S3_BUCKET:-}"
      MAOS_IDLE_MINUTES: "${MAOS_IDLE_MINUTES:-30}"

volumes:
  maos-workspaces:
